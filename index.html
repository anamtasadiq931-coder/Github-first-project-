<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education Details Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        table {
            width: 80%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            border: 1px solid #333;
            padding: 10px 15px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #fafafa;
        }
    </style>
</head>
<body>

    <h2>Educational Qualification</h2>

    <table>
        <thead>
            <tr>
                <th>Qualification (Class)</th>
                <th>Board / University</th>
                <th>Passing Year</th>
                <th>Marks Obtained</th>
                <th>Maximum Marks</th>
                <th>Percentage (%)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>High School (10th)</td>
                <td>UP Board</td>
                <td>2020</td>
                <td>480</td>
                <td>600</td>
                <td>80%</td>
            </tr>
            <tr>
                <td>Intermediate (12th)</td>
                <td>UP Board</td>
                <td>2022</td>
                <td>410</td>
                <td>500</td>
                <td>82%</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
